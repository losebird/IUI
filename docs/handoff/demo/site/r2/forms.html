<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script>
</head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-5">
<div><h2 class="text-lg font-semibold tracking-tight">活动报名</h2><p class="text-sm text-base-content/60">周六 14:00 · 静安店 · 限 20 人</p></div>
<div class="grid grid-cols-2 gap-4">
 <label class="flex flex-col gap-1.5"><span class="text-sm font-medium">姓名</span><input class="input w-full" placeholder="怎么称呼你" value="林晓雯"></label>
 <label class="flex flex-col gap-1.5"><span class="text-sm font-medium">邮箱</span><input class="input w-full input-error" value="lin@example" ><span class="text-xs text-error">邮箱格式不对</span></label>
</div>
<label class="flex flex-col gap-1.5"><span class="text-sm font-medium">参加场次</span><select class="select w-full"><option>周六 14:00（剩 6 席）</option></select></label>
<div class="flex flex-col gap-1.5"><span class="text-sm font-medium">人数</span><div class="tabs tabs-box tabs-sm w-fit"><a class="tab tab-active">1 人</a><a class="tab">2 人</a><a class="tab">3 人以上</a></div></div>
<div class="flex flex-col gap-1.5"><span class="text-sm font-medium">饮品偏好</span><div class="grid grid-cols-2 gap-3">
 <label class="flex items-start gap-3 rounded-box border border-base-content p-3.5"><input type="radio" name="d" class="radio radio-sm mt-0.5" checked><span><span class="block text-sm font-medium">咖啡</span><span class="block text-xs text-base-content/60">现磨美式 / 拿铁</span></span></label>
 <label class="flex items-start gap-3 rounded-box border border-base-300 p-3.5"><input type="radio" name="d" class="radio radio-sm mt-0.5"><span><span class="block text-sm font-medium">茶饮</span><span class="block text-xs text-base-content/60">乌龙 / 茉莉</span></span></label></div></div>
<div class="flex flex-col gap-2"><div class="flex justify-between text-sm"><span class="font-medium">预算</span><span class="num font-medium">¥200</span></div><input type="range" class="range range-xs w-full" min="0" max="500" value="200" step="50"><div class="flex justify-between text-xs text-base-content/50 num"><span>¥0</span><span>¥500</span></div></div>
<label class="flex flex-col gap-1.5"><span class="text-sm font-medium">备注 <span class="text-base-content/40 font-normal">选填</span></span><textarea class="textarea w-full" rows="3" placeholder="有什么想告诉我们的"></textarea></label>
<div class="flex flex-col gap-3 border-t border-base-300 pt-4">
 <label class="flex items-center gap-2.5 text-sm"><input type="checkbox" class="checkbox checkbox-sm" checked>我已阅读并同意<a class="link">活动须知</a></label>
 <label class="flex items-center justify-between text-sm"><span>活动前一天提醒我<span class="block text-xs text-base-content/50">短信 + 站内信</span></span><input type="checkbox" class="toggle toggle-sm" checked></label></div>
<div class="flex justify-end gap-2"><button class="btn btn-ghost">取消</button><button class="btn btn-primary">提交报名</button></div>
</div></div></div><script>ready()</script></body></html>
