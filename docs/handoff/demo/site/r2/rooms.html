<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script></head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-5">
<div class="flex items-end justify-between"><div><h2 class="text-lg font-semibold tracking-tight">会议室看板</h2><div class="text-sm text-base-content/60 mt-0.5">今天 · 当前 10:30</div></div><div class="join bg-base-200 rounded-full p-0.5"><button class="btn btn-xs join-item rounded-full bg-base-100 border-base-300">全部</button><button class="btn btn-xs btn-ghost join-item rounded-full">可用</button><button class="btn btn-xs btn-ghost join-item rounded-full">使用中</button></div></div>
<div class="grid grid-cols-4 rounded-box border border-base-300 divide-x divide-base-300">
 <div class="p-3"><div class="text-xs text-base-content/55">现在可用</div><div class="text-2xl font-semibold num mt-0.5">4<span class="text-sm font-normal text-base-content/50"> 间</span></div></div><div class="p-3"><div class="text-xs text-base-content/55">使用中</div><div class="text-2xl font-semibold num mt-0.5">2<span class="text-sm font-normal text-base-content/50"> 间</span></div></div><div class="p-3"><div class="text-xs text-base-content/55">今日预订</div><div class="text-2xl font-semibold num mt-0.5">10<span class="text-sm font-normal text-base-content/50"> 场</span></div></div><div class="p-3"><div class="text-xs text-base-content/55">利用率 8–20 点</div><div class="text-2xl font-semibold num mt-0.5">18%</div></div></div>
<div><div class="text-sm font-medium mb-2">今日占用</div><div class="relative" id="tl"></div></div>
<div class="grid grid-cols-3 gap-3" id="cards"></div>
</div></div></div>
<script>ready((t)=>{
 const S=8,E=20,now=10.5,pc=h=>(h-S)/(E-S)*100
 const R=[['星河厅','3F · 20 人',[[9,12],[13,14.5]],'使用中','季度规划评审 · 至 12:00'],['松风','3F · 8 人',[[11.5,12.5],[15,16]],'空闲','下一场 11:30'],['云杉','5F · 6 人',[[10.75,11.25],[14,15]],'即将开始','10:45 开始'],['海棠','5F · 12 人',[[9.5,12]],'使用中','设计周会 · 至 12:00'],['竹影（电话间）','6F · 2 人',[],'空闲','今日无预订'],['远山','6F · 16 人',[[16,17]],'空闲','下一场 16:00']]
 tl.innerHTML=`<div class="flex text-[11px] text-base-content/45 num ml-28 mb-1 relative h-4">${[8,11,14,17,20].map(h=>`<span class="absolute -translate-x-1/2" style="left:${pc(h)}%">${h}:00</span>`).join('')}</div>`+R.map(([n,,b])=>`<div class="flex items-center h-7"><div class="w-28 text-sm truncate">${n}</div><div class="flex-1 h-4 rounded-full bg-base-200 relative">${b.map(([a,c])=>`<div class="absolute h-4 rounded-full ${a<=now&&c>now?'bg-base-content':'bg-base-content/30'}" style="left:${pc(a)}%;width:${pc(c)-pc(a)}%"></div>`).join('')}</div></div>`).join('')+`<div class="absolute top-5 bottom-0 w-px bg-error" style="left:calc(7rem + (100% - 7rem) * ${pc(now)/100})"><span class="absolute -top-1 -translate-x-1/2 w-2 h-2 rounded-full bg-error"></span></div>`
 const st={'使用中':'badge-error','空闲':'badge-success','即将开始':'badge-warning'}
 cards.innerHTML=R.map(([n,c,,s,d])=>`<div class="rounded-box border border-base-300 p-4 flex flex-col gap-2"><div class="flex items-center justify-between"><div class="font-medium">${n}</div><span class="badge badge-sm badge-soft ${st[s]}">${s}</span></div><div class="text-xs text-base-content/55">${c} · ${d}</div><button class="btn btn-sm mt-1 ${s=='使用中'?'btn-outline border-base-300':'btn-neutral'}">${s=='使用中'?'查看日程':'预订'}</button></div>`).join('')
})</script></body></html>
