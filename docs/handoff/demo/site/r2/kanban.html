<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script></head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-4">
<div class="flex items-end justify-between"><div><h2 class="text-lg font-semibold tracking-tight">门店上新看板</h2><div class="text-sm text-base-content/60 mt-0.5">秋季上新 · 7 项任务 · 截止 10/26</div></div><div class="flex items-center gap-2"><div class="avatar-group -space-x-2" id="av"></div><button class="btn btn-sm btn-neutral">+ 新任务</button></div></div>
<progress class="progress h-1.5" value="29" max="100"></progress>
<div class="grid grid-cols-3 gap-3" id="cols"></div>
</div></div></div>
<script>ready((t)=>{
 const C=[['待办',[['秋季新品拍摄','林晓雯','10-24','拍摄'],['菜单翻译','王若溪','10-25','内容'],['门头灯箱报价','赵安然','10-26','采购']]],['进行中',[['小红书投放素材','周子昂','10-22','营销',60],['会员积分规则','陈一鸣','10-23','运营',30]]],['已完成',[['徐汇店排班','李沐阳','10-18','运营'],['库存预警阈值','孙嘉禾','10-17','供应链']]]]
 const dot={'待办':'bg-base-content/30','进行中':'bg-warning','已完成':'bg-success'}
 av.innerHTML=['林','周','陈','李'].map(x=>`<div class="avatar avatar-placeholder"><div class="w-7 rounded-full bg-base-200 text-xs border-2 border-base-100">${x}</div></div>`).join('')
 cols.innerHTML=C.map(([n,cs])=>`<div class="rounded-box bg-base-200 p-2.5 flex flex-col gap-2"><div class="flex items-center gap-2 px-1.5 py-1 text-sm font-medium"><span class="w-2 h-2 rounded-full ${dot[n]}"></span>${n}<span class="text-base-content/45 num">${cs.length}</span></div>${cs.map(([ti,p,d,tag,pr])=>`<div class="rounded-[0.875rem] bg-base-100 border border-base-300 p-3 flex flex-col gap-2 ${n=='已完成'?'opacity-60':''}"><div class="text-sm font-medium ${n=='已完成'?'line-through':''}">${ti}</div>${pr?`<progress class="progress h-1" value="${pr}" max="100"></progress>`:''}<div class="flex items-center justify-between"><span class="badge badge-xs badge-ghost">${tag}</span><div class="flex items-center gap-1.5 text-xs text-base-content/55"><span class="num">${d}</span><div class="avatar avatar-placeholder"><div class="w-5 rounded-full bg-base-300 text-[10px]">${p[0]}</div></div></div></div></div>`).join('')}<button class="btn btn-xs btn-ghost justify-start text-base-content/50">+ 添加</button></div>`).join('')
})</script></body></html>
