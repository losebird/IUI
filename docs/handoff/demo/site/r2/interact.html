<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script>
</head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-6">
<div><div role="tablist" class="tabs tabs-border"><a class="tab tab-active">概览</a><a class="tab">明细</a><a class="tab">设置</a></div><p class="text-sm pt-3">本周新增会员 <b class="num">412</b> 人，复购率 <b class="num">27.6%</b>。</p></div>
<ul class="steps w-full text-sm"><li class="step step-neutral" data-content="✓">选择场次<span class="block text-xs text-base-content/50">周六 14:00</span></li><li class="step step-neutral">填写信息<span class="block text-xs text-base-content/50">姓名与联系方式</span></li><li class="step">确认支付<span class="block text-xs text-base-content/50">¥39 / 人</span></li></ul>
<div class="grid grid-cols-2 gap-4 items-center"><div class="flex flex-col gap-2"><div class="flex justify-between text-sm"><span>报名进度</span><span class="num font-medium">68%</span></div><progress class="progress w-full" value="68" max="100"></progress><span class="text-xs text-base-content/50 num">已报 14 / 20 人</span></div>
 <div class="flex items-center gap-4"><div class="radial-progress text-base-content text-sm font-semibold num" style="--value:72;--size:4.25rem;--thickness:5px" role="progressbar">72%</div><div><div class="text-sm font-medium">目标完成</div><div class="text-xs text-base-content/50">本月 72 / 100 场</div></div></div></div>
<div class="join join-vertical w-full">
 <div class="collapse collapse-arrow join-item border border-base-300"><input type="radio" name="a" checked><div class="collapse-title text-sm font-medium">可以带孩子吗？</div><div class="collapse-content text-sm text-base-content/70">可以，12 岁以下免费，需家长陪同。</div></div>
 <div class="collapse collapse-arrow join-item border border-base-300"><input type="radio" name="a"><div class="collapse-title text-sm font-medium">可以退款吗？</div><div class="collapse-content text-sm">x</div></div>
 <div class="collapse collapse-arrow join-item border border-base-300"><input type="radio" name="a"><div class="collapse-title text-sm font-medium">停车方便吗？</div><div class="collapse-content text-sm">x</div></div></div>
<div class="rounded-box border border-base-300 p-4 flex flex-col gap-3"><div class="text-sm font-medium">哪家门店本周销售最高？</div>
 <div class="grid grid-cols-3 gap-2 text-sm"><div class="rounded-field border border-base-300 px-4 py-2.5 text-base-content/50">静安</div><div class="rounded-field border border-success bg-success/10 px-4 py-2.5 font-medium flex items-center justify-between">浦东<span class="text-success" id="ck"></span></div><div class="rounded-field border border-base-300 px-4 py-2.5 text-base-content/50">徐汇</div></div>
 <p class="text-xs text-base-content/60">✓ 答对了 · 浦东 312 千元，比第二名静安高 9%。</p></div>
<div class="flex flex-wrap gap-2"><button class="btn btn-primary">主要</button><button class="btn">次要</button><button class="btn btn-success btn-soft">成功</button><button class="btn btn-error btn-soft">危险</button><button class="btn btn-ghost">幽灵</button><button class="btn btn-disabled">禁用</button><button class="btn btn-primary"><span class="loading loading-spinner loading-xs"></span>提交中</button></div>
</div></div></div><script>ready(() => { document.getElementById('ck').innerHTML = ic('check', 16) })</script></body></html>
