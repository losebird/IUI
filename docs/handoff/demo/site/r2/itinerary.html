<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script><link rel="stylesheet" href="../nm/leaflet/dist/leaflet.css"><script src="../nm/leaflet/dist/leaflet.js"></script>
<style>.pin{width:26px;height:26px;border-radius:999px;background:var(--color-base-content);color:var(--color-base-100);font:600 12px/26px InterVar,sans-serif;text-align:center;box-shadow:0 0 0 3px var(--color-base-100),0 2px 8px rgba(0,0,0,.18)}.pin.on{background:var(--color-primary);color:var(--color-primary-content)}.leaflet-container{font-family:InterVar,sans-serif;background:var(--color-base-200)}.leaflet-control-attribution{font-size:10px;background:color-mix(in oklab,var(--color-base-100) 80%,transparent)!important}</style>
</head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-4">
<div class="flex items-start justify-between"><div><h2 class="text-lg font-semibold tracking-tight">加州海岸 · 三日</h2><div class="text-sm text-base-content/60 mt-0.5">旧金山 → 蒙特雷 → 大苏尔 · 约 250 km</div></div><div class="flex gap-1.5"><span class="badge badge-soft">3 天</span><span class="badge badge-soft">3 站</span></div></div>
<div class="relative rounded-box overflow-hidden border border-base-300"><div id="map" style="height:300px"></div>
 <div class="absolute left-3 bottom-3 z-[500] join bg-base-100 rounded-full border border-base-300 p-0.5"><button class="btn btn-xs btn-ghost join-item rounded-full">全程</button><button class="btn btn-xs btn-ghost join-item rounded-full">Day 1</button><button class="btn btn-xs btn-ghost join-item rounded-full">Day 2</button><button class="btn btn-xs btn-neutral join-item rounded-full">Day 3</button></div></div>
<div class="grid grid-cols-3 gap-3" id="days"></div>
<div class="rounded-box bg-base-200 p-4 flex gap-3"><div class="pin on shrink-0" style="box-shadow:none">3</div><div><div class="font-medium">Day 3 · 大苏尔</div><div class="text-sm text-base-content/65 mt-0.5">比克斯比溪大桥观景台 → 普菲弗海滩 → 麦克维瀑布。沿 1 号公路南行约 2 小时，日落前返回卡梅尔。</div></div></div>
<div class="text-xs text-base-content/45">图片来自 Wikimedia Commons · 地图 © Esri</div>
</div></div></div>
<script>
const P=[['旧金山','金门大桥 · 渔人码头','GoldenGateBridge-001.jpg',[37.8199,-122.4783]],['蒙特雷','水族馆 · 17 英里海岸','Monterey_Bay.jpg',[36.6002,-121.8947]],['大苏尔','比克斯比大桥 · 麦克维瀑布','Bixby_Creek_Bridge.jpg',[36.2704,-121.8081]]]
ready(async (t)=>{
 days.innerHTML=P.map(([n,d,f],i)=>`<div class="rounded-box border ${i==2?'border-base-content':'border-base-300'} overflow-hidden"><img class="w-full h-24 object-cover" src="https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=480"><div class="p-3 flex gap-2.5 items-start"><div class="pin ${i==2?'on':''} shrink-0" style="width:22px;height:22px;line-height:22px;font-size:11px;box-shadow:none">${i+1}</div><div class="min-w-0"><div class="font-medium text-sm">Day ${i+1} · ${n}</div><div class="text-xs text-base-content/55 truncate">${d}</div></div></div></div>`).join('')
 const m=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:.25}); const dk=/dark|dim/.test(document.documentElement.dataset.theme),G=dk?'Dark':'Light',E='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_'+G+'_Gray_'; const tl=L.tileLayer(E+'Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'}).addTo(m)
 const ll=P.map(p=>p[3]); L.polyline([ll[0],[37.55,-122.5],[37.1,-122.3],[36.97,-122.03],[36.85,-121.8],ll[1],[36.45,-121.93],ll[2]],{color:t.ink,weight:3,opacity:.85,smoothFactor:2}).addTo(m)
 P.forEach((p,i)=>L.marker(p[3],{icon:L.divIcon({className:'',html:`<div class="pin ${i==2?'on':''}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(m).bindTooltip(p[0],{permanent:true,direction:'right',offset:[14,0],className:'!bg-base-100 !border-base-300 !rounded-full !shadow-none !text-xs !px-2 !py-0.5'}))
 m.fitBounds(L.latLngBounds(ll).pad(.25)); await new Promise(r=>{tl.on('load',r);setTimeout(r,6000)}); await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})))
},800)
</script></body></html>
