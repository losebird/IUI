<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script><script src="../nm/echarts/dist/echarts.min.js"></script>
</head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-5">
<div class="flex items-start justify-between"><div><div class="text-sm text-base-content/60">上海 · 10/11 周六 · 14:00 更新</div><div class="flex items-end gap-3 mt-1"><div class="text-6xl font-semibold tracking-tight num leading-none">26°</div><div class="pb-1"><div class="font-medium">多云</div><div class="text-sm text-base-content/55 num">最高 26° · 最低 17°</div></div></div></div><div class="text-base-content/80" id="big"></div></div>
<div class="grid grid-cols-4 rounded-box border border-base-300 divide-x divide-base-300 text-sm">
 <div class="p-3"><div class="text-xs text-base-content/55">体感</div><div class="font-semibold num mt-0.5">24°</div></div><div class="p-3"><div class="text-xs text-base-content/55">湿度</div><div class="font-semibold num mt-0.5">62%</div></div><div class="p-3"><div class="text-xs text-base-content/55">东北风</div><div class="font-semibold num mt-0.5">3 级</div></div><div class="p-3"><div class="text-xs text-base-content/55">空气</div><div class="font-semibold mt-0.5"><span class="num">68</span> <span class="badge badge-xs badge-success badge-soft">良</span></div></div></div>
<div><div class="text-sm font-medium mb-1">今日逐时</div><div id="hr" style="height:150px"></div></div>
<div><div class="flex items-center justify-between mb-2"><div class="text-sm font-medium">未来 7 天</div><span class="badge badge-sm badge-warning badge-soft">周二起降温</span></div><div id="wk" class="divide-y divide-base-300"></div></div>
</div></div></div>
<script>ready((t)=>{
 big.innerHTML=ic('psun',56)
 const H=['08','10','12','14','16','18','20','22','00'],T=[18,19.5,22,24.5,26,25.5,23,21,19]
 ec('hr',{grid:{left:20,right:20,top:22,bottom:22},xAxis:{type:'category',data:H.map(h=>h+':00'),boundaryGap:false,...ax(t),splitLine:{show:false}},yAxis:{type:'value',min:15,show:false},series:[{type:'line',data:T,smooth:.35,symbol:'circle',symbolSize:(v,p)=>p.dataIndex==3?9:0,lineStyle:{color:t.ink,width:2},itemStyle:{color:t.ink,borderColor:t.bg,borderWidth:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:t.a(t.ink,.1)},{offset:1,color:t.a(t.ink,0)}]}},label:{show:true,formatter:p=>p.dataIndex==3?'现在 '+p.value+'°':[0,5,8].includes(p.dataIndex)?p.value+'°':'',color:t.a(t.ink,.7),fontSize:11},markLine:{silent:true,symbol:'none',data:[{xAxis:3}],lineStyle:{color:t.a(t.ink,.25),type:'dashed'},label:{show:false}}}]})
 const D=[['今天','10/11','psun','多云',17,26],['周日','10/12','sun','晴',18,28],['周一','10/13','sun','晴',19,27],['周二','10/14','rain','小雨',16,24],['周三','10/15','cloud','阴',16,25],['周四','10/16','rain','中雨',15,22],['周五','10/17','psun','多云',16,23]]
 wk.innerHTML=D.map(([d,dt,i,w,lo,hi],k)=>`<div class="flex items-center gap-3 py-2 text-sm"><div class="w-24 whitespace-nowrap ${k==0?'font-semibold':''}">${d}<span class="text-xs text-base-content/45 num ml-1.5 font-normal">${dt}</span></div><div class="w-6 ${i=='rain'?'text-info':''}">${ic(i,18)}</div><div class="w-10 text-base-content/65">${w}</div><div class="num w-8 text-right text-base-content/55">${lo}°</div><div class="flex-1 h-1.5 rounded-full bg-base-200 relative"><div class="absolute h-1.5 rounded-full bg-base-content" style="left:${(lo-14)/16*100}%;right:${(30-hi)/16*100}%"></div></div><div class="num w-8 font-medium">${hi}°</div></div>`).join('')
})</script></body></html>
