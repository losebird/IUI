<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script></head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-4">
<div class="flex items-end justify-between"><div><h2 class="text-lg font-semibold tracking-tight">上海 · 精选住宿</h2><div class="text-sm text-base-content/60 mt-0.5">10/11–10/13 · 2 晚 · 2 位成人</div></div><span class="badge badge-soft">3 家</span></div>
<div class="grid grid-cols-3 gap-3" id="h"></div>
<div class="flex items-center justify-between text-xs text-base-content/50"><span>示意封面 · 非实时房价 · 图片来自 Wikimedia Commons</span><button class="btn btn-xs btn-ghost">查看更多 →</button></div>
</div></div></div>
<script>ready(async (t)=>{
 const X=[['外滩悦榕庄','The_Bund_Shanghai.jpg','外滩景观','2,800','4.8',['江景','行政酒廊'],1],['豫园附近精品酒店','Yu_Garden.jpg','城隍庙商圈','980','4.6',['含早','步行 3 分钟'],0],['陆家嘴商务酒店','Oriental_Pearl_Tower.jpg','金融区','1,260','4.5',['地铁直达','健身房'],0]]
 h.innerHTML=X.map(([n,f,a,p,s,tags,pick])=>`<div class="rounded-box border border-base-300 overflow-hidden flex flex-col"><div class="relative"><img class="w-full aspect-[4/3] object-cover" src="https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=480">${pick?'<span class="badge badge-sm absolute left-2 top-2 bg-base-100/90 border-0">编辑推荐</span>':''}</div><div class="p-3 flex flex-col gap-1.5 flex-1"><div class="flex items-start justify-between gap-2"><div class="font-medium text-sm leading-snug">${n}</div><div class="flex items-center gap-0.5 text-xs num shrink-0">${ic('star',12)}${s}</div></div><div class="text-xs text-base-content/55 flex items-center gap-1">${ic('pin',12)}${a}</div><div class="flex gap-1 flex-wrap">${tags.map(x=>`<span class="badge badge-xs badge-ghost">${x}</span>`).join('')}</div><div class="mt-auto pt-1.5 flex items-baseline justify-between"><div><span class="text-lg font-semibold num">¥${p}</span><span class="text-xs text-base-content/55"> /晚起</span></div></div></div></div>`).join('')
 await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})))
},600)</script></body></html>
