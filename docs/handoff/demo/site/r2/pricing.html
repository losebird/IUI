<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../nm/daisyui/daisyui.css"><link rel="stylesheet" href="../nm/daisyui/themes.css"><link rel="stylesheet" href="../common.css"><script src="../nm/@tailwindcss/browser/dist/index.global.js"></script><script src="kit.js"></script></head><body class="bg-base-200 p-4"><div id="shot"><div class="card bg-base-100 border border-base-300"><div class="card-body p-6 gap-5">
<div class="flex items-end justify-between"><div><h2 class="text-lg font-semibold tracking-tight">选择适合你的方案</h2><div class="text-sm text-base-content/60 mt-0.5">按月计费 · 随时取消</div></div><div class="join bg-base-200 rounded-full p-0.5"><button class="btn btn-xs btn-ghost join-item rounded-full">按月</button><button class="btn btn-xs join-item rounded-full bg-base-100 border-base-300">按年 <span class="text-success">−20%</span></button></div></div>
<div class="grid grid-cols-3 gap-3 items-stretch" id="tiers"></div>
<div class="text-xs text-base-content/50 text-center">所有方案均含 14 天免费试用 · 价格不含税</div>
</div></div></div>
<script>ready((t)=>{
 const T=[['Starter','¥49','/月','个人与小项目',['1 个项目','基础分析','邮件支持'],'开始使用',0],['Pro','¥129','/月','成长中的团队',['无限项目','高级分析','优先支持','团队席位 ×5'],'升级 Pro',1],['Enterprise','定制','','合规与规模',['SSO / SLA','专属成功经理','私有部署'],'联系销售',0]]
 tiers.innerHTML=T.map(([n,p,u,d,f,b,hot])=>`<div class="rounded-box p-5 flex flex-col gap-4 ${hot?'bg-neutral text-neutral-content':'border border-base-300'}"><div><div class="flex items-center justify-between"><div class="font-semibold">${n}</div>${hot?'<span class="badge badge-sm border-0" style="background:rgba(255,255,255,.16);color:inherit">最受欢迎</span>':''}</div><div class="text-xs mt-0.5 ${hot?'opacity-60':'text-base-content/55'}">${d}</div></div><div class="flex items-baseline gap-1"><span class="text-4xl font-semibold tracking-tight num">${p}</span><span class="text-sm ${hot?'opacity-60':'text-base-content/55'}">${u}</span></div><ul class="text-sm space-y-2 flex-1">${f.map(x=>`<li class="flex gap-2 items-center"><span class="${hot?'':'text-base-content/60'}">${ic('check',15)}</span>${x}</li>`).join('')}</ul><button class="btn btn-sm ${hot?'bg-neutral-content text-neutral border-0':'btn-outline border-base-300'}">${b}</button></div>`).join('')
})</script></body></html>
