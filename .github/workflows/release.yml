name: Release tarball

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pack
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          npm pack
          test -f "losebird-iui-${VERSION}.tgz"
          cp "losebird-iui-${VERSION}.tgz" losebird-iui.tgz
          tar -tzf "losebird-iui-${VERSION}.tgz" | grep -q 'package/lib/index.js'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NOTES="Prebuilt @losebird/iui ${VERSION} (lib/ included).

Install:

\`\`\`bash
dsh plugin --profile web add https://github.com/losebird/IUI/releases/latest/download/losebird-iui.tgz
dsh web
\`\`\`

Do not use \`github:losebird/IUI\` — that clones the source tree and can sit on downloaded 0 while prepack builds."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "losebird-iui-${VERSION}.tgz" \
              losebird-iui.tgz \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "losebird-iui-${VERSION}.tgz" \
              losebird-iui.tgz \
              --title "IUI ${VERSION}" \
              --notes "$NOTES"
          fi
